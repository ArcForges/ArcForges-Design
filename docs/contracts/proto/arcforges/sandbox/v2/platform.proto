// RunService is a typed Sandbox Core surface; remote exposure is a fixed allowlist.
service RunService {
  // Start explicit argv after confinement/resource admission; never enqueue or auto retry.
  // auth: authenticated local owner; remote=run.start
  // idempotency: owner+meta.command_id+canonical request hash; UNKNOWN reconciles via GetOperation
  // deadline: 10 s; timeout does not imply no effect
  // stream: none
  // errors: CONFLICT/revision_mismatch, CONFLICT/command_id_reused, STATE/not_found, STATE/busy, AUTHORIZATION/permission_denied, VALIDATION/invalid_argument, EXECUTION/outcome_unknown, EXECUTION/unsupported_combination, RESOURCE/budget_unavailable, RESOURCE/enforcement_failed
  // locality: local and explicitly granted Center route
  rpc Start(RunServiceStartRequest) returns (RunServiceStartResponse);
  // List visible runs with stable pagination.
  // auth: authenticated local owner; remote=read
  // idempotency: pure read; cursor/snapshot scoped
  // deadline: 10 s; timeout does not imply no effect
  // stream: none
  // errors: STATE/not_found, AUTHORIZATION/permission_denied, VALIDATION/invalid_argument, VALIDATION/invalid_cursor
  // locality: local and explicitly granted Center route
  rpc List(RunServiceListRequest) returns (RunServiceListResponse);
  // Read live or terminal state with exit provenance and limits.
  // auth: authenticated local owner; remote=read
  // idempotency: pure read; cursor/snapshot scoped
  // deadline: 10 s; timeout does not imply no effect
  // stream: none
  // errors: STATE/not_found, AUTHORIZATION/permission_denied, VALIDATION/invalid_argument, VALIDATION/invalid_cursor
  // locality: local and explicitly granted Center route
  rpc Inspect(RunServiceInspectRequest) returns (RunServiceInspectResponse);
  // Request bounded graceful stop then verified owned-group termination.
  // auth: authenticated local owner; remote=run.stop
  // idempotency: owner+meta.command_id+canonical request hash; UNKNOWN reconciles via GetOperation
  // deadline: 10 s; timeout does not imply no effect
  // stream: none
  // errors: CONFLICT/revision_mismatch, CONFLICT/command_id_reused, STATE/not_found, STATE/busy, AUTHORIZATION/permission_denied, VALIDATION/invalid_argument, EXECUTION/outcome_unknown
  // locality: local and explicitly granted Center route
  rpc Stop(RunServiceStopRequest) returns (RunServiceStopResponse);
  // Read untrusted terminal or piped bytes with explicit gaps.
  // auth: authenticated local owner; remote=run.output
  // idempotency: pure read; cursor/snapshot scoped
  // deadline: 10 s; timeout does not imply no effect
  // stream: server; bounded, epoch/cursor, gap and terminal errors
  // errors: STATE/not_found, AUTHORIZATION/permission_denied, VALIDATION/invalid_argument, VALIDATION/invalid_cursor
  // locality: local and explicitly granted Center route
  rpc WatchOutput(RunServiceWatchOutputRequest) returns (stream RunServiceWatchOutputFrame);
  // Acquire or renew local exclusive writer/read-only observer lease.
  // auth: authenticated local owner; remote=forbidden
  // idempotency: owner+meta.command_id+canonical request hash; UNKNOWN reconciles via GetOperation
  // deadline: 10 s; timeout does not imply no effect
  // stream: none
  // errors: CONFLICT/revision_mismatch, CONFLICT/command_id_reused, STATE/not_found, STATE/busy, AUTHORIZATION/permission_denied, VALIDATION/invalid_argument, EXECUTION/outcome_unknown, CONFLICT/lease_stale, STATE/terminal_unavailable
  // locality: local only
  rpc AcquireTerminal(RunServiceAcquireTerminalRequest) returns (RunServiceAcquireTerminalResponse);
  // Write bounded input under current local writer lease.
  // auth: authenticated local owner; remote=forbidden
  // idempotency: owner+meta.command_id+canonical request hash; UNKNOWN reconciles via GetOperation
  // deadline: 10 s; timeout does not imply no effect
  // stream: none
  // errors: CONFLICT/revision_mismatch, CONFLICT/command_id_reused, STATE/not_found, STATE/busy, AUTHORIZATION/permission_denied, VALIDATION/invalid_argument, EXECUTION/outcome_unknown, CONFLICT/lease_stale, STATE/terminal_unavailable
  // locality: local only
  rpc WriteTerminal(RunServiceWriteTerminalRequest) returns (RunServiceWriteTerminalResponse);
  // Apply latest local terminal geometry under current writer lease.
  // auth: authenticated local owner; remote=forbidden
  // idempotency: owner+meta.command_id+canonical request hash; UNKNOWN reconciles via GetOperation
  // deadline: 10 s; timeout does not imply no effect
  // stream: none
  // errors: CONFLICT/revision_mismatch, CONFLICT/command_id_reused, STATE/not_found, STATE/busy, AUTHORIZATION/permission_denied, VALIDATION/invalid_argument, EXECUTION/outcome_unknown, CONFLICT/lease_stale, STATE/terminal_unavailable
  // locality: local only
  rpc ResizeTerminal(RunServiceResizeTerminalRequest) returns (RunServiceResizeTerminalResponse);
  // Release a local attachment without stopping the Run.
  // auth: authenticated local owner; remote=forbidden
  // idempotency: owner+meta.command_id+canonical request hash; UNKNOWN reconciles via GetOperation
  // deadline: 10 s; timeout does not imply no effect
  // stream: none
  // errors: CONFLICT/revision_mismatch, CONFLICT/command_id_reused, STATE/not_found, STATE/busy, AUTHORIZATION/permission_denied, VALIDATION/invalid_argument, EXECUTION/outcome_unknown, CONFLICT/lease_stale, STATE/terminal_unavailable
  // locality: local only
  rpc DetachTerminal(RunServiceDetachTerminalRequest) returns (RunServiceDetachTerminalResponse);
}

