// DataService is a typed Sandbox Core surface; remote exposure is a fixed allowlist.
service DataService {
  // Measure no-follow private data excluding external host mounts.
  // auth: authenticated local owner; remote=data.read
  // idempotency: pure read; cursor/snapshot scoped
  // deadline: 30 s; timeout does not imply no effect
  // stream: none
  // errors: STATE/not_found, AUTHORIZATION/permission_denied, VALIDATION/invalid_argument, VALIDATION/invalid_cursor, VALIDATION/path_rejected, STATE/managed_use, RESOURCE/disk_space, CONFLICT/identity_changed
  // locality: local and explicitly granted Center route
  rpc GetUsage(DataServiceGetUsageRequest) returns (DataServiceGetUsageResponse);
  // List safe owned data entries without following links.
  // auth: authenticated local owner; remote=data.read
  // idempotency: pure read; cursor/snapshot scoped
  // deadline: 30 s; timeout does not imply no effect
  // stream: none
  // errors: STATE/not_found, AUTHORIZATION/permission_denied, VALIDATION/invalid_argument, VALIDATION/invalid_cursor, VALIDATION/path_rejected, STATE/managed_use, RESOURCE/disk_space, CONFLICT/identity_changed
  // locality: local and explicitly granted Center route
  rpc ListEntries(DataServiceListEntriesRequest) returns (DataServiceListEntriesResponse);
  // Stage a regular-file upload under owned root; no archive extraction.
  // auth: authenticated local owner; remote=data.write
  // idempotency: owner+meta.command_id+canonical request hash; UNKNOWN reconciles via GetOperation
  // deadline: 30 s; timeout does not imply no effect
  // stream: none
  // errors: CONFLICT/revision_mismatch, CONFLICT/command_id_reused, STATE/not_found, STATE/busy, AUTHORIZATION/permission_denied, VALIDATION/invalid_argument, EXECUTION/outcome_unknown, VALIDATION/path_rejected, STATE/managed_use, RESOURCE/disk_space, CONFLICT/identity_changed
  // locality: local and explicitly granted Center route
  rpc BeginImport(DataServiceBeginImportRequest) returns (DataServiceBeginImportResponse);
  // Append or identically replay a bounded verified chunk.
  // auth: authenticated local owner; remote=data.write
  // idempotency: owner+meta.command_id+canonical request hash; UNKNOWN reconciles via GetOperation
  // deadline: 30 s; timeout does not imply no effect
  // stream: none
  // errors: CONFLICT/revision_mismatch, CONFLICT/command_id_reused, STATE/not_found, STATE/busy, AUTHORIZATION/permission_denied, VALIDATION/invalid_argument, EXECUTION/outcome_unknown, VALIDATION/path_rejected, STATE/managed_use, RESOURCE/disk_space, CONFLICT/identity_changed
  // locality: local and explicitly granted Center route
  rpc WriteImport(DataServiceWriteImportRequest) returns (DataServiceWriteImportResponse);
  // Verify complete length/hash then atomically publish within ownership lock.
  // auth: authenticated local owner; remote=data.write
  // idempotency: owner+meta.command_id+canonical request hash; UNKNOWN reconciles via GetOperation
  // deadline: 30 s; timeout does not imply no effect
  // stream: none
  // errors: CONFLICT/revision_mismatch, CONFLICT/command_id_reused, STATE/not_found, STATE/busy, AUTHORIZATION/permission_denied, VALIDATION/invalid_argument, EXECUTION/outcome_unknown, VALIDATION/path_rejected, STATE/managed_use, RESOURCE/disk_space, CONFLICT/identity_changed
  // locality: local and explicitly granted Center route
  rpc CommitImport(DataServiceCommitImportRequest) returns (DataServiceCommitImportResponse);
  // Bind an owned regular file to a bounded immutable export snapshot.
  // auth: authenticated local owner; remote=data.read
  // idempotency: owner+meta.command_id+canonical request hash; UNKNOWN reconciles via GetOperation
  // deadline: 30 s; timeout does not imply no effect
  // stream: none
  // errors: CONFLICT/revision_mismatch, CONFLICT/command_id_reused, STATE/not_found, STATE/busy, AUTHORIZATION/permission_denied, VALIDATION/invalid_argument, EXECUTION/outcome_unknown, VALIDATION/path_rejected, STATE/managed_use, RESOURCE/disk_space, CONFLICT/identity_changed
  // locality: local and explicitly granted Center route
  rpc BeginExport(DataServiceBeginExportRequest) returns (DataServiceBeginExportResponse);
  // Read a bounded snapshot range, verifying actor and expiry.
  // auth: authenticated local owner; remote=data.read
  // idempotency: pure read; cursor/snapshot scoped
  // deadline: 30 s; timeout does not imply no effect
  // stream: none
  // errors: STATE/not_found, AUTHORIZATION/permission_denied, VALIDATION/invalid_argument, VALIDATION/invalid_cursor, VALIDATION/path_rejected, STATE/managed_use, RESOURCE/disk_space, CONFLICT/identity_changed
  // locality: local and explicitly granted Center route
  rpc ReadExport(DataServiceReadExportRequest) returns (DataServiceReadExportResponse);
  // Close or cancel staging without hiding an uncertain committed effect.
  // auth: authenticated local owner; remote=data.write for import or data.read for export; actor/grant must own transfer
  // idempotency: owner+meta.command_id+canonical request hash; UNKNOWN reconciles via GetOperation
  // deadline: 30 s; timeout does not imply no effect
  // stream: none
  // errors: CONFLICT/revision_mismatch, CONFLICT/command_id_reused, STATE/not_found, STATE/busy, AUTHORIZATION/permission_denied, VALIDATION/invalid_argument, EXECUTION/outcome_unknown, VALIDATION/path_rejected, STATE/managed_use, RESOURCE/disk_space, CONFLICT/identity_changed
  // locality: local and explicitly granted Center route
  rpc CloseTransfer(DataServiceCloseTransferRequest) returns (DataServiceCloseTransferResponse);
}

