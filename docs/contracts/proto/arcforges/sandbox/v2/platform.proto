// SandboxService is a typed Sandbox Core surface; remote exposure is a fixed allowlist.
service SandboxService {
  // Create an owned persistent data environment.
  // auth: authenticated local owner; remote=sandbox.create
  // idempotency: owner+meta.command_id+canonical request hash; UNKNOWN reconciles via GetOperation
  // deadline: 10 s; timeout does not imply no effect
  // stream: none
  // errors: CONFLICT/revision_mismatch, CONFLICT/command_id_reused, STATE/not_found, STATE/busy, AUTHORIZATION/permission_denied, VALIDATION/invalid_argument, EXECUTION/outcome_unknown, EXECUTION/unsupported_combination, RESOURCE/budget_unavailable, RESOURCE/enforcement_failed
  // locality: local and explicitly granted Center route
  rpc Create(SandboxServiceCreateRequest) returns (SandboxServiceCreateResponse);
  // Replace a revision-checked configuration; access changes require quiescence.
  // auth: authenticated local owner; remote=sandbox.configure
  // idempotency: owner+meta.command_id+canonical request hash; UNKNOWN reconciles via GetOperation
  // deadline: 10 s; timeout does not imply no effect
  // stream: none
  // errors: CONFLICT/revision_mismatch, CONFLICT/command_id_reused, STATE/not_found, STATE/busy, AUTHORIZATION/permission_denied, VALIDATION/invalid_argument, EXECUTION/outcome_unknown, EXECUTION/unsupported_combination, RESOURCE/budget_unavailable, RESOURCE/enforcement_failed
  // locality: local and explicitly granted Center route
  rpc Configure(SandboxServiceConfigureRequest) returns (SandboxServiceConfigureResponse);
  // List visible persistent environments.
  // auth: authenticated local owner; remote=read
  // idempotency: pure read; cursor/snapshot scoped
  // deadline: 10 s; timeout does not imply no effect
  // stream: none
  // errors: STATE/not_found, AUTHORIZATION/permission_denied, VALIDATION/invalid_argument, VALIDATION/invalid_cursor
  // locality: local and explicitly granted Center route
  rpc List(SandboxServiceListRequest) returns (SandboxServiceListResponse);
  // Read policy, capability, usage location and active runs.
  // auth: authenticated local owner; remote=read
  // idempotency: pure read; cursor/snapshot scoped
  // deadline: 10 s; timeout does not imply no effect
  // stream: none
  // errors: STATE/not_found, AUTHORIZATION/permission_denied, VALIDATION/invalid_argument, VALIDATION/invalid_cursor
  // locality: local and explicitly granted Center route
  rpc Inspect(SandboxServiceInspectRequest) returns (SandboxServiceInspectResponse);
  // Preview exact owned data and concurrent-use blockers.
  // auth: authenticated local owner; remote=sandbox.delete
  // idempotency: pure read; cursor/snapshot scoped
  // deadline: 10 s; timeout does not imply no effect
  // stream: none
  // errors: STATE/not_found, AUTHORIZATION/permission_denied, VALIDATION/invalid_argument, VALIDATION/invalid_cursor, VALIDATION/path_rejected, STATE/managed_use, RESOURCE/disk_space, CONFLICT/identity_changed
  // locality: local and explicitly granted Center route
  rpc PlanDelete(SandboxServicePlanDeleteRequest) returns (SandboxServicePlanDeleteResponse);
  // Consume an unchanged delete plan under the same Sandbox admission lock.
  // auth: authenticated local owner; remote=sandbox.delete
  // idempotency: owner+meta.command_id+canonical request hash; UNKNOWN reconciles via GetOperation
  // deadline: 10 s; timeout does not imply no effect
  // stream: none
  // errors: CONFLICT/revision_mismatch, CONFLICT/command_id_reused, STATE/not_found, STATE/busy, AUTHORIZATION/permission_denied, VALIDATION/invalid_argument, EXECUTION/outcome_unknown, VALIDATION/path_rejected, STATE/managed_use, RESOURCE/disk_space, CONFLICT/identity_changed
  // locality: local and explicitly granted Center route
  rpc Delete(SandboxServiceDeleteRequest) returns (SandboxServiceDeleteResponse);
}

