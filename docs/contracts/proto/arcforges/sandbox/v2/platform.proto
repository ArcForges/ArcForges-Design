// ResourceService is a typed Sandbox Core surface; remote exposure is a fixed allowlist.
service ResourceService {
  // Read sampled host/Sandbox/Run budgets and actual limits.
  // auth: authenticated local owner; remote=resource.read
  // idempotency: pure read; cursor/snapshot scoped
  // deadline: 10 s; timeout does not imply no effect
  // stream: none
  // errors: STATE/not_found, AUTHORIZATION/permission_denied, VALIDATION/invalid_argument, VALIDATION/invalid_cursor
  // locality: local and explicitly granted Center route
  rpc GetBudget(ResourceServiceGetBudgetRequest) returns (ResourceServiceGetBudgetResponse);
  // Set bounded resource policy; requested and applied state remain distinct.
  // auth: authenticated local owner; remote=resource.configure
  // idempotency: owner+meta.command_id+canonical request hash; UNKNOWN reconciles via GetOperation
  // deadline: 10 s; timeout does not imply no effect
  // stream: none
  // errors: CONFLICT/revision_mismatch, CONFLICT/command_id_reused, STATE/not_found, STATE/busy, AUTHORIZATION/permission_denied, VALIDATION/invalid_argument, EXECUTION/outcome_unknown
  // locality: local and explicitly granted Center route
  rpc SetPolicy(ResourceServiceSetPolicyRequest) returns (ResourceServiceSetPolicyResponse);
  // Read bounded sampled usage; slow clients resnapshot.
  // auth: authenticated local owner; remote=resource.read
  // idempotency: pure read; cursor/snapshot scoped
  // deadline: 10 s; timeout does not imply no effect
  // stream: server; bounded, epoch/cursor, gap and terminal errors
  // errors: STATE/not_found, AUTHORIZATION/permission_denied, VALIDATION/invalid_argument, VALIDATION/invalid_cursor
  // locality: local and explicitly granted Center route
  rpc WatchUsage(ResourceServiceWatchUsageRequest) returns (stream ResourceServiceWatchUsageFrame);
}

message ResourceServiceGetBudgetRequest {
  arcforges.foundation.v1.RequestMeta meta = 1 [json_name = "meta"]; // validate: required; command_id for mutation, expected_rev for existing aggregate CAS
  reserved 2 to 9;
  optional string scope_kind = 10 [json_name = "scopeKind"]; // validate: node/sandbox/run
  arcforges.foundation.v1.Id scope_id = 11 [json_name = "scopeId"]; // validate: required except node
}

message ResourceServiceGetBudgetResponse {
  arcforges.foundation.v1.ResponseMeta meta = 1 [json_name = "meta"];
  oneof outcome {
    ResourceServiceGetBudgetValue value = 2 [json_name = "value"];
