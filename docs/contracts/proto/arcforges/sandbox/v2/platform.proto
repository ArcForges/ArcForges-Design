  }
  reserved 4 to 9;
}

message ResourceServiceGetBudgetValue {
  ResourceSnapshot snapshot = 10 [json_name = "snapshot"]; // validate: actual timestamps and units
}

message ResourceServiceSetPolicyRequest {
  arcforges.foundation.v1.RequestMeta meta = 1 [json_name = "meta"]; // validate: required; command_id for mutation, expected_rev for existing aggregate CAS
  reserved 2 to 9;
  optional string scope_kind = 10 [json_name = "scopeKind"]; // validate: node/sandbox/run
  arcforges.foundation.v1.Id scope_id = 11 [json_name = "scopeId"]; // validate: required except node
  ResourcePolicy policy = 12 [json_name = "policy"]; // validate: required local/remote-ceiling validated
}

message ResourceServiceSetPolicyResponse {
