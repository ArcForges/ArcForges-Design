name: Design checks

# Every PR is verified after the push on the Windows and Linux hosts (eng/verify.py run-and-report, AD-0020), whose
# statuses main requires, so the job is skipped for owner (deku2026) PRs; external PRs, the merge queue and manual
# dispatch run it. Push to main runs nothing: every main commit arrived through a PR verified one way or the other.
# merge_group runs the check for every author, but only matters if a merge queue is configured (none is today).
on:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: design-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: "true"
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  PYTHONUTF8: "1"

jobs:
  check:
    name: Contracts, schemas, state machines, links, traceability
    if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.user.login == 'deku2026') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Verify exact local and CI tool versions
        run: python eng/check_toolchain.py
      - name: Restore the pinned proto toolchain (locked)
        run: dotnet restore tools/proto-toolchain/ProtoToolchain.csproj --locked-mode
      - name: Design checks (protoc required; generated C# must build warning-free)
        run: python tools/check_design.py --require-protoc --compile
      - name: Check tool tests
        run: python -m unittest discover -s tests -v
