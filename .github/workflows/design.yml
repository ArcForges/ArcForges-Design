name: Design checks

# Owner (deku2026) PRs are verified by the local pre-push hook (eng/verify.py, AD-0016), so the job is skipped for
# them; external PRs, the merge queue and manual dispatch run it. Push to main runs nothing: every main commit arrived
# through a PR verified one way or the other.
# merge_group runs the check for every author, but only matters if a merge queue is configured (none is today).
on:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: design-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: "true"
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  PYTHONUTF8: "1"

jobs:
  check:
    name: Contracts, schemas, state machines, links, traceability
    if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.user.login == 'deku2026') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - name: Restore the pinned proto toolchain (locked)
        run: dotnet restore tools/proto-toolchain/ProtoToolchain.csproj --locked-mode
      - name: Design checks (protoc required; generated C# must build warning-free)
        run: python tools/check_design.py --require-protoc --compile
      - name: Check tool tests
        run: python -m unittest discover -s tests -v
